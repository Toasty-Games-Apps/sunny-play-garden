<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Little Sprout Park: a sprout friend in a flower pot under a rainbow. Source for every icon size (tools/make-icons.mjs). -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fcaf4"/><stop offset=".62" stop-color="#bfeafc"/><stop offset="1" stop-color="#e8f9ff"/></linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff3a6"/><stop offset=".55" stop-color="#ffe066" stop-opacity=".9"/><stop offset="1" stop-color="#ffe066" stop-opacity="0"/></radialGradient>
    <radialGradient id="head" cx=".38" cy=".3" r=".8"><stop offset="0" stop-color="#b6f07f"/><stop offset=".6" stop-color="#7fd95a"/><stop offset="1" stop-color="#55b844"/></radialGradient>
    <linearGradient id="leafL" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8ee35f"/><stop offset="1" stop-color="#3fa447"/></linearGradient>
    <linearGradient id="leafR" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a6ef6e"/><stop offset="1" stop-color="#4cb24a"/></linearGradient>
    <linearGradient id="hill1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fe07a"/><stop offset="1" stop-color="#6cc35a"/></linearGradient>
    <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fd26a"/><stop offset="1" stop-color="#4fae54"/></linearGradient>
    <linearGradient id="pot" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d86a3c"/><stop offset=".45" stop-color="#f08a52"/><stop offset="1" stop-color="#c85c34"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffab73"/><stop offset="1" stop-color="#e8804a"/></linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <circle cx="404" cy="104" r="78" fill="url(#sun)"/>
  <!-- rainbow -->
  <g fill="none" stroke-width="15" stroke-linecap="round">
    <path d="M58 372A198 198 0 0 1 454 372" stroke="#ff6b81"/>
    <path d="M73 372A183 183 0 0 1 439 372" stroke="#ffa64d"/>
    <path d="M88 372A168 168 0 0 1 424 372" stroke="#ffe066"/>
    <path d="M103 372A153 153 0 0 1 409 372" stroke="#7ed957"/>
    <path d="M118 372A138 138 0 0 1 394 372" stroke="#5cc8f2"/>
    <path d="M133 372A123 123 0 0 1 379 372" stroke="#a48cf5"/>
  </g>
