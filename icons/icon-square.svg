  <ellipse cx="256" cy="470" rx="112" ry="14" fill="#2f7a3a" opacity=".3"/>
  <path d="M256 196C252 168 254 146 262 124" stroke="#3f9a45" stroke-width="16" stroke-linecap="round" fill="none"/>
  <path d="M262 132C232 78 156 66 120 102C150 164 226 172 262 132Z" fill="url(#leafL)" stroke="#2f8a3e" stroke-width="7" stroke-linejoin="round"/>
  <path d="M258 130C222 114 180 102 140 102" stroke="#2f8a3e" stroke-width="6" stroke-linecap="round" fill="none" opacity=".7"/>
  <path d="M262 128C286 66 366 44 404 80C380 150 300 168 262 128Z" fill="url(#leafR)" stroke="#2f8a3e" stroke-width="7" stroke-linejoin="round"/>
  <path d="M266 126C304 102 348 86 388 82" stroke="#2f8a3e" stroke-width="6" stroke-linecap="round" fill="none" opacity=".7"/>
  <ellipse cx="342" cy="86" rx="24" ry="9" transform="rotate(-20 342 86)" fill="#fff" opacity=".45"/>
  <path d="M256 186C328 186 364 236 364 292C364 352 316 392 256 392S148 352 148 292C148 236 184 186 256 186Z" fill="url(#head)" stroke="#2f8a3e" stroke-width="8"/>
  <ellipse cx="214" cy="228" rx="30" ry="15" transform="rotate(-25 214 228)" fill="#fff" opacity=".45"/>
  <ellipse cx="218" cy="290" rx="18" ry="24" fill="#3b2a40"/><ellipse cx="294" cy="290" rx="18" ry="24" fill="#3b2a40"/>
  <circle cx="211" cy="280" r="7.5" fill="#fff"/><circle cx="287" cy="280" r="7.5" fill="#fff"/>
  <circle cx="224" cy="301" r="3.4" fill="#fff" opacity=".8"/><circle cx="300" cy="301" r="3.4" fill="#fff" opacity=".8"/>
  <ellipse cx="184" cy="322" rx="18" ry="11" fill="#ff86a6" opacity=".8"/><ellipse cx="328" cy="322" rx="18" ry="11" fill="#ff86a6" opacity=".8"/>
  <path d="M232 326Q256 354 280 326Q256 337 232 326Z" fill="#d64a6a" stroke="#3b2a40" stroke-width="7" stroke-linejoin="round"/>
  <path d="M150 386H362L344 470Q342 478 334 478H178Q170 478 168 470Z" fill="url(#pot)" stroke="#9e4524" stroke-width="7" stroke-linejoin="round"/>
  <rect x="134" y="358" width="244" height="40" rx="14" fill="url(#rim)" stroke="#9e4524" stroke-width="7"/>
  <rect x="150" y="365" width="120" height="9" rx="4.5" fill="#fff" opacity=".35"/>
  <path d="M256 456C226 436 222 414 238 408C248 404 254 410 256 416C258 410 264 404 274 408C290 414 286 436 256 456Z" fill="#fff4ec"/>
