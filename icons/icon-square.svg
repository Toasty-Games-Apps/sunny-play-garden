  <g fill="#fff"><circle cx="92" cy="138" r="26"/><circle cx="122" cy="126" r="32"/><circle cx="154" cy="140" r="24"/><rect x="70" y="138" width="104" height="26" rx="13"/></g>
  <!-- hills -->
