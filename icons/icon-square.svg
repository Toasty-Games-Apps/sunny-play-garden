  <path d="M0 452C120 420 250 428 512 418V512H0z" fill="url(#hill2)"/>
  <g fill="#fff" opacity=".9"><circle cx="70" cy="452" r="7"/><circle cx="446" cy="440" r="7"/><circle cx="410" cy="470" r="5"/></g>
  <g fill="#ffd54a"><circle cx="70" cy="452" r="3"/><circle cx="446" cy="440" r="3"/><circle cx="410" cy="470" r="2.4"/></g>
